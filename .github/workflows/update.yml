name: update-lottery-data

on:
  schedule:
    # 每天 22:40 北京时间（14:40 UTC），覆盖当天所有彩种开奖
    - cron: "40 14 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "回补全部历史期的奖级详情（慢，可分多次跑自动续接）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lottery-update
  cancel-in-progress: false

env:
  TYPES: "ssq dlt sd pls plw qlc kl8 qxc sfc jq4 zc6"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch + commit per lottery type (resumable)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for t in $TYPES; do
            echo "===== $t ====="
            if [ "${{ inputs.backfill }}" = "true" ]; then
              python scripts/fetch_lottery.py --type "$t" --full || true
            else
              python scripts/fetch_lottery.py --type "$t" || true
            fi
            git add "data/$t.json" || true
            git commit -m "chore(data): update $t" || true
            git pull --rebase origin main || true
            git push || true
          done

      - name: Render dashboard + site
        run: |
          python scripts/render_dashboard.py
          python scripts/render_site.py

      - name: Commit dashboard
        run: |
          git add DASHBOARD.md latest.json index.json docs/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(dashboard): $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push
          fi
